<html lang="zh-CN">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风之旅人 · 登录</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
    --card-bg:rgba(255,255,255,0.85);
    --card-shadow:0 8px 40px rgba(70,130,180,0.15);
    --text:#2c3e50;--text-muted:#94a3b8;
    --input-bg:#f7fafc;--input-border:#e2e8f0;
    --btn-bg:#74b9ff;--btn-hover:#0984e3;
    --tab-bg:#f0f4f8;--tab-slider:#fff;
}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;transition:background 0.8s;
}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.theme-switcher{position:fixed;top:60px;right:16px;z-index:100;display:flex;flex-direction:column;gap:8px;}
.theme-btn{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.2);cursor:pointer;font-size:1.1rem;backdrop-filter:blur(8px);transition:all 0.3s;}
.theme-btn.active{border-color:#fff;background:rgba(255,255,255,0.5);transform:scale(1.12);}
.dark-toggle{position:fixed;top:16px;right:16px;z-index:100;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.15);cursor:pointer;font-size:1.1rem;backdrop-filter:blur(8px);color:#fff;}

.login-card{
    position:relative;z-index:1;width:420px;max-width:92vw;
    background:var(--card-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-radius:28px;padding:36px 32px 28px;box-shadow:var(--card-shadow);
    animation:cardUp 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards;opacity:0;
    transition:background 0.5s,box-shadow 0.5s;
}
@keyframes cardUp{0%{opacity:0;transform:translateY(30px)}100%{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

.login-logo{text-align:center;margin-bottom:20px;}
.logo-circle{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#e0f0f8,#f0e8f4);display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 8px;box-shadow:0 4px 16px rgba(0,0,0,0.06);}
.login-logo h2{font-size:1.2rem;font-weight:700;color:var(--text);margin:0;}
.login-logo p{font-size:0.72rem;color:var(--text-muted);margin:2px 0 0;letter-spacing:1px;}

.login-tabs{display:flex;position:relative;background:var(--tab-bg);border-radius:14px;padding:4px;margin-bottom:20px;}
.login-tab{flex:1;text-align:center;padding:10px;border-radius:12px;cursor:pointer;font-size:0.88rem;font-weight:600;transition:0.3s;border:none;background:transparent;color:#94a3b8;position:relative;z-index:1;}
.login-tab.active{color:var(--text);}
.tab-slider{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);background:var(--tab-slider);border-radius:11px;box-shadow:0 2px 8px rgba(0,0,0,0.06);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);z-index:0;pointer-events:none;}
.login-tabs.register-active .tab-slider{transform:translateX(100%);}
.login-tabs.register-active .login-tab:first-child{color:#94a3b8;}
.login-tabs.register-active .login-tab:last-child{color:var(--text);}

.input-wrap{display:flex;align-items:center;gap:10px;background:var(--input-bg);border:1.5px solid var(--input-border);border-radius:14px;padding:0 14px;margin-bottom:12px;transition:0.3s;}
.input-wrap:focus-within{border-color:#a0c4e8;box-shadow:0 0 0 3px rgba(160,196,232,0.15);background:#fff;}
.input-icon{font-size:1rem;flex-shrink:0;}
.input-wrap input{flex:1;padding:13px 0;border:none;background:transparent;font-size:0.9rem;font-family:inherit;color:var(--text);outline:none;}
.input-wrap input::placeholder{color:#c0c8d0;}

.btn-login{width:100%;padding:14px;margin-top:6px;background:var(--btn-bg);color:#fff;border:none;border-radius:14px;font-size:0.95rem;font-weight:700;cursor:pointer;transition:0.3s;letter-spacing:0.5px;}
.btn-login:hover{background:var(--btn-hover);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,0.15);}
.btn-login:active{transform:scale(0.98);}
.btn-login:disabled{opacity:0.5;cursor:not-allowed;}
.agreement{text-align:center;margin-top:16px;font-size:0.7rem;color:#c0c8d0;}
.agreement a{color:#a0c4e8;text-decoration:none;}

.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(120px);padding:10px 22px;border-radius:20px;font-weight:500;font-size:0.85rem;z-index:200;opacity:0;transition:all 0.4s ease;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.ok{background:#34d399;color:#000;}
.toast.err{background:#f87171;color:#fff;}

@media(max-width:440px){.login-card{padding:32px 20px 24px;border-radius:24px;}}

/* 暗黑模式 */
body.dark{background:#0f172a;}
body.dark .login-card{background:rgba(15,23,42,0.92);box-shadow:0 8px 40px rgba(0,0,0,0.3);}
body.dark .login-logo h2{color:#e2e8f0;}
body.dark .login-logo p{color:#94a3b8;}
body.dark .login-tabs{background:#1e293b;}
body.dark .login-tab{color:#94a3b8;}
body.dark .login-tab.active,body.dark .login-tabs.register-active .login-tab:last-child{color:#e2e8f0;}
body.dark .tab-slider{background:#334155;}
body.dark .input-wrap{background:#1e293b;border-color:#334155;}
body.dark .input-wrap input{color:#e2e8f0;}
body.dark .input-wrap input::placeholder{color:#64748b;}
body.dark .input-wrap:focus-within{border-color:#6366f1;background:#1e293b;}
body.dark .agreement{color:#64748b;}
body.dark .dark-toggle{border-color:rgba(255,255,255,0.2);}

<script>
(function(){
const SUPABASE_URL='https://gxbeztgssxniuqwawsrz.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_CEoUalap5DiFEfkBBuqJCw_DL21vR5o';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

// ======== 三主题背景 ========
const cvs=document.getElementById('bgCanvas'),ctx=cvs.getContext('2d');
let W,H,mx=-999,my=-999,time=0;
let theme=localStorage.getItem('ww_bg_theme')||'sky';
let particles=[],ripples=[];
const isMobile=/Mobi|Android/i.test(navigator.userAgent);
const PARTICLE_MAX=isMobile?{sky:30,ocean:28,desert:35}:{sky:60,ocean:55,desert:70};
let motionEnabled=true,musicEnabled=true,pageFocused=true;
let audioCtx=null,musicGain=null,musicTimer=null,sfxEnabled=true;
document.addEventListener('visibilitychange',()=>{pageFocused=!document.hidden;});

const themeColors={
    sky:{grad:['#e0f0ff','#f8fafc','#ffffff'],btnBg:'#74b9ff',btnHover:'#0984e3',text:'#2c3e50',cardShadow:'rgba(70,130,180,0.15)'},
    ocean:{grad:['#e0f7fa','#b2ebf2','#80deea'],btnBg:'#4dd0e1',btnHover:'#00acc1',text:'#006064',cardShadow:'rgba(80,160,180,0.15)'},
    desert:{grad:['#fff3e0','#ffe0b2','#ffcc80'],btnBg:'#ffb74d',btnHover:'#f57c00',text:'#5d4037',cardShadow:'rgba(180,140,100,0.15)'},
};
function applyTheme(t){
    theme=t;const c=themeColors[t];
    document.documentElement.style.setProperty('--btn-bg',c.btnBg);
    document.documentElement.style.setProperty('--btn-hover',c.btnHover);
    document.documentElement.style.setProperty('--text',c.text);
    document.documentElement.style.setProperty('--card-shadow','0 8px 40px '+c.cardShadow);
    // SVG 中景
    document.getElementById('skyBirds').style.display=t==='sky'?'block':'none';
    document.getElementById('oceanFish').style.display=t==='ocean'?'block':'none';
    document.getElementById('desertTraveler').style.display=t==='desert'?'block':'none';
    particles=[];ripples=[];
    if(musicEnabled)startMusic();
}

// 🎵 主题音乐（Web Audio API 生成轻钢琴旋律）
function getMusicNotes(t){
    // 五声音阶 + 温暖和弦分解，温馨治愈风格
    if(t==='sky')return[
        {n:523,d:2.0},{n:587,d:1.0},{n:659,d:1.5},{n:784,d:1.0},{n:880,d:2.0},{n:784,d:1.0},{n:659,d:1.5},{n:587,d:1.0},
        {n:523,d:2.0},{n:440,d:1.5},{n:523,d:1.0},{n:587,d:1.5},{n:659,d:2.0},{n:587,d:1.0},{n:523,d:2.5},
        {n:659,d:1.5},{n:784,d:1.0},{n:880,d:2.0},{n:784,d:1.0},{n:659,d:2.0},{n:587,d:1.5},{n:523,d:2.5},
    ];
    if(t==='ocean')return[
        {n:392,d:2.0},{n:440,d:1.5},{n:494,d:2.0},{n:587,d:1.0},{n:523,d:1.5},{n:494,d:1.0},{n:440,d:2.0},{n:392,d:1.5},
        {n:330,d:2.0},{n:392,d:1.0},{n:440,d:2.0},{n:494,d:1.5},{n:523,d:2.0},{n:494,d:1.0},{n:440,d:2.5},
        {n:392,d:1.5},{n:440,d:1.0},{n:494,d:2.0},{n:440,d:1.5},{n:392,d:2.0},{n:330,d:1.5},{n:392,d:2.5},
    ];
    return[
        {n:330,d:2.0},{n:392,d:1.5},{n:440,d:2.0},{n:494,d:1.0},{n:523,d:1.5},{n:494,d:1.0},{n:440,d:2.0},{n:392,d:2.0},
        {n:330,d:1.5},{n:294,d:2.0},{n:330,d:1.0},{n:392,d:2.0},{n:440,d:1.5},{n:392,d:2.0},{n:330,d:2.5},
        {n:392,d:1.5},{n:440,d:1.0},{n:494,d:2.0},{n:523,d:1.5},{n:494,d:2.0},{n:440,d:1.5},{n:392,d:2.5},
    ];
}
let musicIdx=0;
function startMusic(){
    stopMusic();
    if(!musicEnabled)return;
    try{
        if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        if(audioCtx.state==='suspended')audioCtx.resume();
        let vol=parseFloat(localStorage.getItem('ww_music_vol')||'0.6');
        musicGain=audioCtx.createGain();musicGain.gain.value=vol;musicGain.connect(audioCtx.destination);
        const notes=getMusicNotes(theme);
        function playNote(){
            if(!musicEnabled||!audioCtx||!musicGain)return;
            const{n,d}=notes[musicIdx%notes.length];musicIdx++;
            const o=audioCtx.createOscillator(),g=audioCtx.createGain();
            o.type='triangle';o.frequency.value=n;
            const dur=d*0.7,t=audioCtx.currentTime;
            g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.08,t+0.05);
            g.gain.exponentialRampToValueAtTime(0.001,t+dur);
            const f=audioCtx.createBiquadFilter();f.type='lowpass';f.frequency.value=900;f.Q.value=2;
            o.connect(g).connect(f);f.connect(musicGain);
            o.start(t);o.stop(t+dur+0.3);
            musicTimer=setTimeout(playNote,d*950);
        }
        playNote();
    }catch(_){}
}
function stopMusic(){if(musicTimer){clearTimeout(musicTimer);musicTimer=null;}if(musicGain){try{musicGain.disconnect();}catch(_){}}musicGain=null;if(musicIdx)musicIdx=0;}

// 🎵 音乐开关 + 音量滑块
document.getElementById('musicToggle').addEventListener('click',()=>{
    musicEnabled=!musicEnabled;
    document.getElementById('musicToggle').textContent=musicEnabled?'🎵':'🔇';
    document.getElementById('volSlider').style.display=musicEnabled?'block':'none';
    if(musicEnabled)startMusic();else stopMusic();
});
const volSlider=document.createElement('input');
volSlider.type='range';volSlider.id='volSlider';volSlider.min='0';volSlider.max='1';volSlider.step='0.05';
volSlider.value=localStorage.getItem('ww_music_vol')||'0.6';
volSlider.style.cssText='position:fixed;top:56px;right:114px;z-index:101;width:80px;accent-color:#74b9ff;display:none;';
document.body.appendChild(volSlider);
volSlider.addEventListener('input',()=>{
    const v=parseFloat(volSlider.value);
    localStorage.setItem('ww_music_vol',v);
    if(musicGain)musicGain.gain.value=v;
});
if(musicEnabled)volSlider.style.display='block';
// 🔊 音效开关（已有按钮 darkToggle，作为音效切换）
const sfxToggleBtn=document.createElement('button');
sfxToggleBtn.className='dark-toggle';sfxToggleBtn.id='sfxToggle';sfxToggleBtn.title='音效开关';
sfxToggleBtn.textContent='🔔';sfxToggleBtn.style.cssText='position:fixed;top:16px;right:160px;z-index:100;';
document.body.appendChild(sfxToggleBtn);
sfxToggleBtn.addEventListener('click',()=>{
    sfxEnabled=!sfxEnabled;
    sfxToggleBtn.textContent=sfxEnabled?'🔔':'🔕';
    sfxToggleBtn.style.opacity=sfxEnabled?'1':'0.5';
});
// ✨ 动态效果开关
document.getElementById('motionToggle').addEventListener('click',()=>{
    motionEnabled=!motionEnabled;
    document.getElementById('motionToggle').textContent=motionEnabled?'✨':'🚫';
    if(!motionEnabled){particles=[];ripples=[];}
});
// 预初始化音频上下文（用户首次点击后激活）
document.addEventListener('click',function initAudio(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}if(audioCtx.state==='suspended')audioCtx.resume();},{once:true});
// 初始化音乐
setTimeout(()=>{if(musicEnabled)startMusic();},1500);
applyTheme(theme);

function resize(){W=cvs.width=innerWidth;H=cvs.height=innerHeight;}
resize();window.addEventListener('resize',resize);
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
document.addEventListener('mouseleave',()=>{mx=-999;my=-999;});
document.addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY;},{passive:true});

document.querySelectorAll('.theme-btn').forEach(b=>b.addEventListener('click',()=>{

// === 晴空絮语 ===
// ☁ 半透明软云朵（径向渐变，无硬边缘）
const skyClouds=[
    {x:0.15,y:0.08,w:280,h:100,spd:0.00012,phase:0},
    {x:0.42,y:0.16,w:350,h:130,spd:0.00018,phase:1.5},
    {x:0.72,y:0.10,w:310,h:115,spd:0.00014,phase:3},
    {x:0.55,y:0.24,w:240,h:90,spd:0.00016,phase:5},
    {x:0.88,y:0.18,w:260,h:100,spd:0.00013,phase:2},
];
function drawSoftCloud(cx,cy,w,h){
    // 径向渐变绘制云朵，无硬边缘
    const parts=[
        {x:cx,y:cy,r:w*0.22},{x:cx-w*0.18,y:cy-h*0.05,r:w*0.15},{x:cx+w*0.18,y:cy-h*0.05,r:w*0.15},
        {x:cx-w*0.08,y:cy-h*0.18,r:w*0.13},{x:cx+w*0.08,y:cy-h*0.18,r:w*0.13},{x:cx,y:cy-h*0.22,r:w*0.14},
    ];
    parts.forEach(p=>{
        const grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
        grad.addColorStop(0,'rgba(255,255,255,0.7)');
        grad.addColorStop(0.5,'rgba(255,255,255,0.35)');
        grad.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=grad;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    });
}
function drawSky(){
    const g=ctx.createLinearGradient(0,0,0,H);
    const isDark=document.body.classList.contains('dark');
    if(isDark){g.addColorStop(0,'#1a2a40');g.addColorStop(0.5,'#1e3348');g.addColorStop(1,'#243750');}
    else{g.addColorStop(0,'#a8c8e0');g.addColorStop(0.5,'#c8ddec');g.addColorStop(1,'#e8f0f6');}
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    if(isDark){
        const moonX=W*0.78,moonY=H*0.15,mr=55;
        ctx.fillStyle='rgba(255,250,220,0.9)';ctx.beginPath();ctx.arc(moonX,moonY,mr,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(255,255,200,0.3)';ctx.beginPath();ctx.arc(moonX,moonY,mr*2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(220,210,170,0.4)';
        ctx.beginPath();ctx.arc(moonX-15,moonY-10,mr*0.18,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(moonX+10,moonY+15,mr*0.25,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(moonX-5,moonY+20,mr*0.12,0,Math.PI*2);ctx.fill();
    }else{
        // 白天：5朵软云朵从左向右飘
        skyClouds.forEach(c=>{
            c.x+=c.spd;
            if(c.x*W-c.w>W+100){c.x=(-c.w-50)/W;}
            const cx=c.x*W,cy=c.y*H+Math.sin(time*0.008+c.phase)*8;
            drawSoftCloud(cx,cy,c.w,c.h);
        });
    }
    // 光斑粒子
    if(motionEnabled&&particles.length<PARTICLE_MAX.sky&&Math.random()<0.25){particles.push({x:Math.random()*W,y:Math.random()*H,r:0.5+Math.random()*1.8,a:0.25+Math.random()*0.45,va:0.005+Math.random()*0.01,vy:-(0.3+Math.random()*0.5),vx:(Math.random()-0.5)*0.3,phase:Math.random()*6});}
}
// === 浅海涟漪 ===
function drawOcean(){
    const g=ctx.createLinearGradient(0,0,0,H);
    const isDark=document.body.classList.contains('dark');
    if(isDark){g.addColorStop(0,'#0d2137');g.addColorStop(0.5,'#143652');g.addColorStop(1,'#1a4060');}
    else{g.addColorStop(0,'#e0f7fa');g.addColorStop(0.5,'#b2ebf2');g.addColorStop(1,'#80deea');}
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(let layer=0;layer<3;layer++){
        ctx.strokeStyle=`rgba(255,255,255,${0.25-layer*0.07})`;ctx.lineWidth=2+layer;
        ctx.beginPath();
        for(let x=0;x<=W;x+=6){
            const y=H*(0.35+layer*0.18)+Math.sin(x*0.012+time*0.012*(0.5+layer*0.25)+layer*2)*18+Math.sin(x*0.025+time*0.018)*8;
            x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        }
        ctx.stroke();
    }
    ripples=ripples.filter(r=>{r.r+=1.5;r.life-=0.015;return r.life>0;});
    ripples.forEach(r=>{ctx.strokeStyle=`rgba(255,255,255,${r.life*0.4})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();});
    if(motionEnabled&&particles.length<PARTICLE_MAX.ocean&&Math.random()<0.25){particles.push({x:Math.random()*W,y:H+5,r:3+Math.random()*4,a:0.4+Math.random()*0.3,vy:-(0.4+Math.random()*0.6),vx:(Math.random()-0.5)*0.25,phase:Math.random()*6});}
}
// === 金沙流影 ===
let duneOff1=0,duneOff2=0;
function drawDesert(){
    const g=ctx.createLinearGradient(0,0,0,H);
    const isDark=document.body.classList.contains('dark');
    if(isDark){g.addColorStop(0,'#2a1f18');g.addColorStop(0.5,'#3d2e22');g.addColorStop(1,'#4d3a2a');}
    else{g.addColorStop(0,'#fff3e0');g.addColorStop(0.5,'#ffe0b2');g.addColorStop(1,'#ffcc80');}
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    duneOff1+=0.2;duneOff2+=0.4;
    ctx.fillStyle='rgba(255,204,128,0.4)';
    ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=15){const y=H*0.6+Math.sin((x+duneOff1)*0.005)*35+Math.sin((x+duneOff1)*0.015)*20;ctx.lineTo(x,y);}
    ctx.lineTo(W,H);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,183,77,0.5)';
    ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=12){const y=H*0.72+Math.sin((x+duneOff2)*0.004)*30+Math.sin((x+duneOff2)*0.012)*18;ctx.lineTo(x,y);}
    ctx.lineTo(W,H);ctx.closePath();ctx.fill();
    if(motionEnabled&&particles.length<PARTICLE_MAX.desert&&Math.random()<0.35){particles.push({x:-10,y:Math.random()*H*0.7,r:1+Math.random()*3,a:0.3+Math.random()*0.4,vy:-(0.2+Math.random()*0.3),vx:0.5+Math.random()*0.7,phase:Math.random()*6});}
}

// 粒子渲染
function drawParticles(){
    particles=particles.filter(p=>{
        p.y+=p.vy;p.x+=p.vx;
        if(theme==='sky'){p.a+=p.va*Math.sin(time*0.03+p.phase);p.a=Math.max(0.15,Math.min(0.8,p.a));}
        if(theme==='ocean'){if(p.y<-20||p.x<-20||p.x>W+20)return false;}
        if(theme==='desert'){if(p.x>W+20){p.x=-10;p.y=Math.random()*H*0.7;}}
        return p.y>-30&&p.y<H+30&&p.x>-30&&p.x<W+30;
    });
    const isDark=document.body.classList.contains('dark');
    particles.forEach(p=>{
        const c=theme==='sky'?'255,255,255':theme==='ocean'?'220,245,255':'255,224,178';
        if(isDark){ctx.shadowColor=`rgba(${c},0.8)`;ctx.shadowBlur=8+p.r*3;}
        ctx.fillStyle=`rgba(${c},${isDark?Math.min(1,p.a*1.3):p.a})`;
        ctx.beginPath();
        if(theme==='sky'){ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
            ctx.fillStyle=`rgba(${c},${isDark?p.a*0.7:p.a*0.4})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.5,0,Math.PI*2);ctx.fill();}
        else if(theme==='ocean'){ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(p.x-p.r*0.2,p.y-p.r*0.3,p.r*0.25,0,Math.PI*2);ctx.fill();}
        else{ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
        ctx.shadowColor='transparent';ctx.shadowBlur=0;
    });
}

function bgLoop(){
    ctx.clearRect(0,0,W,H);
    if(theme==='sky')drawSky();else if(theme==='ocean')drawOcean();else drawDesert();
    drawParticles();time++;requestAnimationFrame(bgLoop);
}
bgLoop();

// ======== 暗黑模式 ========
const darkBtn=document.getElementById('darkToggle');
const savedDark=localStorage.getItem('ww_theme')||'light';
if(savedDark==='dark'){document.body.classList.add('dark');darkBtn.textContent='☀';}
darkBtn.addEventListener('click',()=>{
    const isDark=document.body.classList.toggle('dark');
    localStorage.setItem('ww_theme',isDark?'dark':'light');
    darkBtn.textContent=isDark?'☀':'🌙';
});

// ======== 🔊 点击音效 ========
function playClickSfx(){
    if(!sfxEnabled||!audioCtx)return;
    const t=audioCtx.currentTime;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.setValueAtTime(800,t);o.frequency.exponentialRampToValueAtTime(400,t+0.06);
    g.gain.setValueAtTime(0.04,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    o.connect(g).connect(audioCtx.destination);
    o.start(t);o.stop(t+0.06);
}
document.addEventListener('click',e=>{if(e.target.closest('button')||e.target.closest('a'))playClickSfx();});

// ======== 登录/注册 ========
const tabs=document.querySelectorAll('.login-tab');
const loginFields=document.getElementById('loginFields');
const registerFields=document.getElementById('registerFields');
const btnSubmit=document.getElementById('btnSubmit');
const loginTabs=document.getElementById('loginTabs');
let mode='login';

tabs.forEach(t=>t.addEventListener('click',()=>{
    tabs.forEach(x=>x.classList.remove('active'));
    t.classList.add('active');mode=t.dataset.mode;
    loginFields.style.display=mode==='login'?'block':'none';
    registerFields.style.display=mode==='register'?'block':'none';
    btnSubmit.textContent=mode==='register'?'注 册':'登 录';
    if(mode==='register')loginTabs.classList.add('register-active');
    else loginTabs.classList.remove('register-active');
}));

function showToast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(err?'err':'ok');t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);}
function shakeCard(){const c=document.getElementById('loginCard');c.style.animation='none';c.offsetHeight;c.style.animation='shake 0.5s ease';setTimeout(()=>{c.style.animation='cardUp 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards';},500);}

document.getElementById('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();btnSubmit.disabled=true;
    if(mode==='register'){
        const u=document.getElementById('regUser').value.trim();
        const p=document.getElementById('regPass').value.trim();
        const p2=document.getElementById('regPass2').value.trim();
        if(u.length<3){showToast('用户名至少3个字符',true);shakeCard();btnSubmit.disabled=false;return;}
        if(p.length<6){showToast('密码至少6位',true);shakeCard();btnSubmit.disabled=false;return;}
        if(p!==p2){showToast('两次密码不一致',true);shakeCard();btnSubmit.disabled=false;return;}
        btnSubmit.textContent='⏳ 注册中...';
        const isAscii=/^[a-zA-Z0-9]+$/.test(u);
        const emailId=isAscii?u:('u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5));
        const email=emailId+'@windwalker.app';
        try{
            const{data,error}=await supabase.auth.signUp({email,password:p,options:{data:{username:u}}});
            if(error){const msg=error.message.includes('already')?'用户名已存在':error.message;showToast(msg,true);btnSubmit.textContent='注 册';btnSubmit.disabled=false;return;}
            if(!data.user){showToast('注册失败',true);btnSubmit.textContent='注 册';btnSubmit.disabled=false;return;}
            const randomAvatar=[{c:'#ffb8c6',i:'🐱'},{c:'#ffc8a0',i:'🐶'},{c:'#f0c0e0',i:'🐰'},{c:'#b8d8f0',i:'🐼'},{c:'#f0c8a0',i:'🦊'},{c:'#c0e0c8',i:'🐸'},{c:'#e0d0b8',i:'🐻'},{c:'#ffd0d0',i:'🐥'},{c:'#d0c8f0',i:'🦄'},{c:'#c8e8d0',i:'🌿'},{c:'#ffe0b0',i:'⭐'},{c:'#e0d8f8',i:'🌙'}][Math.floor(Math.random()*12)];
            const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" rx="100" fill="#fff"/><circle cx="100" cy="100" r="70" fill="${randomAvatar.c}" opacity="0.5"/><text x="100" y="125" text-anchor="middle" font-size="65">${randomAvatar.i}</text></svg>`;
            let avatarUrl='';
            try{const blob=new Blob([svg],{type:'image/svg+xml'});const{error:upErr}=await supabase.storage.from('avatars').upload(data.user.id+'_av.svg',blob,{upsert:true});if(!upErr){const{data:pub}=supabase.storage.from('avatars').getPublicUrl(data.user.id+'_av.svg');avatarUrl=pub.publicUrl;}}catch(_){}
            const code=String(Math.floor(100000+Math.random()*900000));
            const pf={id:data.user.id,username:u,user_code:code,avatar_url:avatarUrl};
            if(!isAscii)pf.email_id=emailId;
            await supabase.from('profiles').upsert(pf);
            if(!data.session){btnSubmit.textContent='⏳ 登录中...';const{error:loginErr}=await supabase.auth.signInWithPassword({email,password:p});if(loginErr){showToast('注册成功但登录失败，请手动登录',true);btnSubmit.textContent='注 册';btnSubmit.disabled=false;return;}}
            showToast('✅ 注册成功！');
            setTimeout(()=>window.location.href='index.html',800);
        }catch(_){showToast('网络错误',true);btnSubmit.textContent='注 册';btnSubmit.disabled=false;}
    }else{
        const u=document.getElementById('loginUser').value.trim();
        const p=document.getElementById('loginPass').value.trim();
        if(!u){showToast('请输入用户名',true);shakeCard();btnSubmit.disabled=false;return;}
        if(!p){showToast('请输入密码',true);shakeCard();btnSubmit.disabled=false;return;}
        btnSubmit.textContent='⏳ 登录中...';
        try{
            const{data:pf}=await supabase.from('profiles').select('email_id').eq('username',u).maybeSingle();
            const email=(pf?.email_id||u)+'@windwalker.app';
            const{data,error}=await supabase.auth.signInWithPassword({email,password:p});
            if(error){showToast('账号或密码错误',true);shakeCard();btnSubmit.textContent='登 录';btnSubmit.disabled=false;return;}
            showToast('✅ 登录成功！');
            setTimeout(()=>window.location.href='index.html',800);
        }catch(_){showToast('网络错误',true);btnSubmit.textContent='登 录';btnSubmit.disabled=false;}
    }
});

// 卡片3D倾斜
const card=document.getElementById('loginCard');
document.addEventListener('mousemove',e=>{const r=card.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const rx=(e.clientY-cy)/(r.height/2)*-5;const ry=(e.clientX-cx)/(r.width/2)*5;card.style.transform=`perspective(800px) rotateX(${rx}deg) rotateY(${ry}deg)`;});
document.addEventListener('mouseleave',()=>{card.style.transform='';});
})();
</script>
