<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风之旅人 · 登录</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #06080d;
            --surface: #0c0f16;
            --border: #1e2636;
            --text: #e2e8f0;
            --text-muted: #7c8aa0;
            --accent: #38bdf8;
            --accent2: #818cf8;
            --accent-glow: rgba(56,189,248,0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Ambient glow */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(56,189,248,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(129,140,248,0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Canvas particles */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ========== Phone Mockup ========== */
        .phone-frame {
            position: relative;
            z-index: 1;
            width: 380px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 32px;
            padding: 40px 28px 32px;
            box-shadow:
                0 0 0 6px #0a0d14,
                0 0 0 8px var(--border),
                0 20px 60px rgba(0,0,0,0.6);
            animation: phoneUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes phoneUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Notch */
        .phone-notch {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 24px;
            background: #0a0d14;
            border-radius: 0 0 16px 16px;
        }

        /* Status bar */
        .phone-status {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .btn-music-mini {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            margin-left: 8px;
        }
        .btn-music-mini:hover { background: rgba(255,255,255,0.12); color: var(--accent); }
        .btn-music-mini.muted { opacity: 0.4; }

        /* ========== Splash inside phone ========== */
        .phone-splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            transition: opacity 0.5s ease, max-height 0.6s ease;
            overflow: hidden;
            max-height: 140px;
        }

        .phone-splash.hidden {
            opacity: 0;
            max-height: 0;
            margin: 0;
            padding: 0;
            pointer-events: none;
        }

        .splash-logo {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, #0c1622, #162032);
            border: 2px solid rgba(56,189,248,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            animation: logoPop 0.5s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0);
        }

        @keyframes logoPop {
            0% { opacity: 0; transform: scale(0) rotate(-20deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .splash-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-top: 12px;
            letter-spacing: 1px;
            animation: fadeUp 0.5s 0.35s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        .splash-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 2px;
            animation: fadeUp 0.5s 0.5s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ========== Login Form ========== */
        .login-section {
            transition: opacity 0.5s ease 0.3s;
        }

        .login-section.waiting {
            opacity: 0;
            pointer-events: none;
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .login-header p {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Tab switch: password / SMS */
        .login-tabs {
            display: flex;
            background: var(--bg);
            border-radius: 10px;
            padding: 3px;
            margin-bottom: 20px;
            gap: 2px;
        }

        .login-tab {
            flex: 1;
            text-align: center;
            padding: 9px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            transition: 0.3s;
            border: none;
            background: transparent;
        }

        .login-tab.active {
            background: var(--surface);
            color: var(--text);
            font-weight: 600;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        /* Phone input */
        .phone-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .country-code {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 12px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .country-code:hover {
            border-color: rgba(56,189,248,0.4);
        }

        .input-group {
            flex: 1;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            transition: 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .input-group input::placeholder {
            color: rgba(255,255,255,0.18);
        }

        /* Code row */
        .code-row {
            display: flex;
            gap: 10px;
        }

        .btn-code {
            flex-shrink: 0;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 13px 16px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-code:hover {
            background: rgba(56,189,248,0.1);
        }

        .btn-code.counting {
            border-color: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Login button */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px var(--accent-glow);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* Agreement */
        .agreement {
            text-align: center;
            margin-top: 12px;
            font-size: 0.7rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .agreement a {
            color: var(--accent);
            text-decoration: none;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.72rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Social */
        .social-row {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .social-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(56,189,248,0.4);
            transform: translateY(-2px);
        }

        /* ========== Toast ========== */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.85rem;
            z-index: 100;
            opacity: 0;
            transition: all 0.4s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.ok { background: #34d399; color: #000; }
        .toast.err { background: #f87171; color: #fff; }

        /* ========== Responsive ========== */
        /* 涟漪动画 */
        @keyframes rippleOut {
            0% { transform: scale(0); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }
        /* 抖动动画 */
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        /* 按钮粒子爆发 */
        .btn-login:active::after {
            content: ''; position: absolute; inset: -10px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            animation: rippleOut 0.5s ease-out forwards; pointer-events: none; border-radius: 50%;
        }

        @media (max-width: 440px) {
            .phone-frame {
                width: calc(100vw - 32px);
                border-radius: 24px;
                padding: 32px 20px 24px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <!-- ========== Phone Frame ========== -->
    <div class="phone-frame">
        <div class="phone-notch"></div>
        <div class="phone-status">
            <span>9:41</span>
            <span>📶 <button class="btn-music-mini" id="btnMusicMini" title="音乐">🔊</button> 🔋</span>
        </div>

        <!-- Splash -->
        <div class="phone-splash" id="phoneSplash">
            <div class="splash-logo">🔷</div>
            <div class="splash-title">风之旅人</div>
            <div class="splash-sub">3D MODEL HUB</div>
        </div>

        <!-- Login -->
        <div class="login-section waiting" id="loginSection">
            <div class="login-header">
                <h2>欢迎回来</h2>
                <p>登录你的模型资源库</p>
            </div>

            <!-- Tabs -->
            <div class="login-tabs">
                <button class="login-tab active" data-mode="password">账号登录</button>
                <button class="login-tab" data-mode="register">注册账号</button>
            </div>

            <form id="loginForm" novalidate>
                <!-- Username -->
                <div class="input-group" style="margin-bottom:12px;">
                    <input type="text" id="phoneInput" placeholder="请输入用户名" required>
                </div>

                <!-- Password mode -->
                <div id="passwordMode">
                    <div class="input-group">
                        <input type="password" id="passwordInput" placeholder="请输入密码" required>
                    </div>
                </div>

                <!-- SMS mode -->
                <div id="registerMode" style="display:none;">
                    <div class="input-group" style="margin-bottom:12px;">
                        <input type="text" id="regUsername" placeholder="设置用户名 (3-16位)" maxlength="16">
                    </div>
                    <div class="input-group" style="margin-bottom:12px;">
                        <input type="password" id="regPassword" placeholder="设置密码 (6-20位)" maxlength="20">
                    </div>
                    <div class="input-group" style="margin-bottom:12px;">
                        <input type="password" id="regPassword2" placeholder="确认密码">
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnSubmitMain">登 录</button>
                <div style="text-align:center;margin-top:8px;">
                    <a href="#" id="forgotPwdLink" style="color:var(--accent);font-size:0.78rem;text-decoration:none;">忘记密码？</a>
                </div>
            </form>

            <div id="forgotPwdPanel" style="display:none;text-align:center;padding:10px 0;">
                <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:8px;">输入用户名，发送重置邮件</p>
                <input type="text" id="forgotUsername" placeholder="输入用户名" style="width:100%;padding:10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;color:var(--text);margin-bottom:8px;font-family:inherit;">
                <button id="forgotSubmit" style="width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600;">发送重置链接</button>
                <a href="#" id="forgotBack" style="display:block;margin-top:8px;color:var(--text-muted);font-size:0.75rem;">← 返回登录</a>
            </div>

            <div class="agreement">
                登录即表示同意 <a href="#">用户协议</a> 和 <a href="#">隐私政策</a>
            </div>

            <div class="divider">其他方式登录</div>

            <div class="social-row">
                <button class="social-btn">💬</button>
                <button class="social-btn">🐧</button>
                <button class="social-btn">📢</button>
                <button class="social-btn">🍎</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
    (function() {
        // ============================================================
        // ⚙ Supabase 配置 — 替换为你的 Supabase 项目信息
        //    在 Supabase 后台 → Settings → API 里找到这两个值
        // ============================================================
        const SUPABASE_URL = 'https://gxbeztgssxniuqwawsrz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_CEoUalap5DiFEfkBBuqJCw_DL21vR5o';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========== 🐟 鱼塘背景 ==========
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let W, H, mx = -999, my = -999, time = 0;

        function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
        resize(); window.addEventListener('resize', resize);
        document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
        document.addEventListener('mouseleave', () => { mx = -999; my = -999; });
        document.addEventListener('touchmove', e => { mx = e.touches[0].clientX; my = e.touches[0].clientY; }, {passive:true});

        // 🐟 可爱鱼
        const fishes = [];
        const fishTypes = [
            { body:'#ff8c69', fin:'#ff6347', cheek:'#ffb3a0', name:'小橘' },   // 橘红锦鲤
            { body:'#ffb8c0', fin:'#ff9098', cheek:'#ffd0d8', name:'小粉' },   // 粉色金鱼
            { body:'#ffe0b0', fin:'#ffc878', cheek:'#fff0d8', name:'小金' },   // 金色锦鲤
            { body:'#ffe8e8', fin:'#ffd0d0', cheek:'#ffc0c0', name:'小白' },   // 白里透红
            { body:'#ffc8a0', fin:'#ffa878', cheek:'#ffe0c8', name:'小花' },   // 花斑
        ];
        for (let i=0;i<5;i++) {
            const t = fishTypes[i%fishTypes.length];
            fishes.push({
                x: Math.random()*W, y: 80+Math.random()*(H-180),
                vx: (Math.random()-0.5)*1.2, vy: (Math.random()-0.5)*0.4,
                size: 22+Math.random()*18, type: t,
                tailPhase: Math.random()*6, eyeBlink: 0, bubbleTimer: Math.random()*100
            });
        }
        // 莲花
        const lotuses = [];
        for (let i=0;i<3;i++) lotuses.push({ x: Math.random()*W, y: 40+Math.random()*(H*0.3), size: 15+Math.random()*20, phase: Math.random()*6 });
        // 水草
        const plants = [];
        for (let i=0;i<8;i++) plants.push({ x: Math.random()*W, h: 40+Math.random()*80, w: 5+Math.random()*8, phase: Math.random()*6 });
        // 气泡
        const bubbles = [];
        function addBubble() { bubbles.push({ x:Math.random()*W, y:H+10, r:2+Math.random()*5, vy:0.3+Math.random()*0.5, o:0.3+Math.random()*0.4 }); }
        for (let i=0;i<15;i++) { const b={x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*5,vy:0,o:0};bubbles.push(b); }
        // 涟漪
        const ripples = [];
        document.addEventListener('click', e => { ripples.push({ x:e.clientX, y:e.clientY, r:0, maxR:60, o:0.6 }); });

        function drawFish(f) {
            ctx.save(); ctx.translate(f.x, f.y);
            const dir = f.vx>0?1:-1; ctx.scale(dir, 1);
            const s = f.size, t = f.type, wiggle = Math.sin(time*0.12+f.tailPhase)*0.3;

            // 尾巴（先画，在身体下面）
            const tailWag = Math.sin(time*0.2+f.tailPhase)*8;
            ctx.fillStyle = t.fin; ctx.beginPath();
            ctx.moveTo(-s*0.55, 0);
            ctx.bezierCurveTo(-s*0.9, -s*0.35+tailWag*0.5, -s*1.4, -s*0.45+tailWag, -s*1.3, -s*0.15+tailWag);
            ctx.bezierCurveTo(-s*1.3, s*0.05+tailWag, -s*0.9, s*0.35-tailWag*0.5, -s*0.55, 0);
            ctx.fill();

            // 身体
            const bodyGrad = ctx.createRadialGradient(s*0.05, -s*0.1, s*0.05, 0, 0, s);
            bodyGrad.addColorStop(0, '#ffffff'); bodyGrad.addColorStop(0.35, t.body); bodyGrad.addColorStop(0.7, t.body); bodyGrad.addColorStop(1, 'rgba(0,0,0,0.08)');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath(); ctx.ellipse(0, 0, s*0.75, s*0.42, 0, 0, Math.PI*2); ctx.fill();

            // 腮红
            ctx.fillStyle = t.cheek; ctx.globalAlpha = 0.6;
            ctx.beginPath(); ctx.ellipse(s*0.28, s*0.12, s*0.13, s*0.08, 0, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1;

            // 大眼睛
            const eyeX = s*0.32, eyeY = -s*0.08;
            // 眼白
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(eyeX, eyeY, s*0.18, s*0.2, 0.1, 0, Math.PI*2); ctx.fill();
            // 瞳孔
            ctx.fillStyle = '#2a1a10'; ctx.beginPath(); ctx.arc(eyeX+s*0.03, eyeY+s*0.01, s*0.12, 0, 7); ctx.fill();
            // 高光
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(eyeX-s*0.03, eyeY-s*0.06, s*0.06, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(eyeX+s*0.06, eyeY+s*0.05, s*0.03, 0, 7); ctx.fill();

            // 小嘴
            ctx.strokeStyle = t.fin; ctx.lineWidth = s*0.04; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(s*0.2, s*0.12, s*0.08, 0.3, 1.5); ctx.stroke();
            ctx.lineWidth = 1;

            // 背鳍
            ctx.fillStyle = t.fin; ctx.globalAlpha = 0.5;
            ctx.beginPath(); ctx.moveTo(-s*0.1, -s*0.35);
            ctx.quadraticCurveTo(s*0.1, -s*0.55+wiggle*3, s*0.3, -s*0.32); ctx.lineTo(s*0.1, -s*0.28); ctx.fill();
            // 腹鳍
            ctx.beginPath(); ctx.moveTo(s*0.05, s*0.22);
            ctx.quadraticCurveTo(0, s*0.4+wiggle*2, -s*0.15, s*0.28); ctx.lineTo(0, s*0.18); ctx.fill();
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        function drawLotus(l) {
            ctx.save(); ctx.translate(l.x, l.y);
            // 花瓣
            const petalCount = 6;
            for (let i=0;i<petalCount;i++) {
                const a = i*Math.PI*2/petalCount + Math.sin(time*0.02+l.phase)*0.1;
                ctx.fillStyle = `rgba(255,200,210,0.7)`;
                ctx.beginPath(); ctx.ellipse(Math.cos(a)*l.size*0.5, Math.sin(a)*l.size*0.5, l.size*0.4, l.size*0.25, a, 0, Math.PI*2); ctx.fill();
            }
            // 花心
            ctx.fillStyle='#f0e080'; ctx.beginPath(); ctx.arc(0,0,l.size*0.25,0,7); ctx.fill();
            // 莲叶
            ctx.fillStyle='rgba(120,190,140,0.6)';
            ctx.beginPath(); ctx.ellipse(0, l.size*0.3, l.size*1.2, l.size*0.6, 0, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function drawPlant(p) {
            ctx.strokeStyle='rgba(100,180,120,0.5)'; ctx.lineWidth=p.w; ctx.lineCap='round';
            ctx.beginPath(); ctx.moveTo(p.x, H);
            for (let i=0;i<4;i++) {
                const t = i/4;
                const sway = Math.sin(time*0.03+p.phase+i)*15;
                ctx.lineTo(p.x+sway, H-p.h*t);
            }
            ctx.stroke();
        }

        function drawPond() {
            ctx.clearRect(0,0,W,H);
            // 水背景渐变
            const water = ctx.createLinearGradient(0,0,0,H);
            water.addColorStop(0,'#d4eaf0'); water.addColorStop(0.3,'#c8e8f0'); water.addColorStop(0.7,'#b0d8e8'); water.addColorStop(1,'#90c0d8');
            ctx.fillStyle=water; ctx.fillRect(0,0,W,H);
            // 水面波纹
            for (let x=0;x<W;x+=60) {
                const y = 20+Math.sin(time*0.05+x*0.05)*3;
                ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1;
                ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+40,y+Math.sin(time*0.05+(x+40)*0.05)*3); ctx.stroke();
            }
            // 水草
            for (const p of plants) drawPlant(p);
            // 🐟 鱼游泳
            for (const f of fishes) {
                // 鼠标吸引
                const dx=mx-f.x, dy=my-f.y, dist=Math.hypot(dx,dy)||1;
                if (dist<250 && mx>0) {
                    f.vx+=(dx/dist)*0.05;
                    f.vy+=(dy/dist)*0.05;
                }
                // 随机游动 + 偶尔加速
                if (Math.random()<0.01) { f.vx+=(Math.random()-0.5)*2; f.vy+=(Math.random()-0.5)*1; } // 偶尔冲刺
                f.vx+=(Math.random()-0.5)*0.08; f.vy+=(Math.random()-0.5)*0.04;
                f.vx*=0.985; f.vy*=0.985;
                // 速度限制
                const spd = Math.hypot(f.vx, f.vy);
                if (spd>3) { f.vx*=2.8/spd; f.vy*=2.8/spd; }
                if (spd<0.3 && mx<0) { f.vx+=(Math.random()-0.5)*0.3; } // 没鼠标时保持游动
                f.x+=f.vx; f.y+=f.vy;
                if (f.x<-80) f.x=W+80; if (f.x>W+80) f.x=-80;
                if (f.y<20) f.y=20; if (f.y>H-20) f.y=H-20;
                // 鱼吐泡泡
                f.bubbleTimer++;
                if (f.bubbleTimer>80+Math.random()*60) {
                    f.bubbleTimer=0;
                    bubbles.push({x:f.x+(f.vx>0?-15:15), y:f.y-5, r:1.5+Math.random()*3, vy:0.2+Math.random()*0.4, o:0.4});
                }
                drawFish(f);
            }
            // 莲花
            for (const l of lotuses) { l.x+=Math.sin(time*0.01+l.phase)*0.2; l.y+=Math.cos(time*0.015+l.phase)*0.15; drawLotus(l); }
            // 气泡
            for (let i=bubbles.length-1;i>=0;i--) {
                const b=bubbles[i]; b.y-=b.vy; b.x+=Math.sin(time*0.03+i)*0.3;
                if (b.y<-20) { b.y=H+10; b.x=Math.random()*W; }
                ctx.fillStyle=`rgba(255,255,255,${b.o})`; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
            }
            if (Math.random()<0.03) addBubble();
            // 涟漪
            for (let i=ripples.length-1;i>=0;i--) {
                const r=ripples[i]; r.r+=1.5; r.o-=0.015;
                if (r.o<=0) { ripples.splice(i,1); continue; }
                ctx.strokeStyle=`rgba(255,255,255,${r.o})`; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,7); ctx.stroke();
            }
            time++; requestAnimationFrame(drawPond);
        }
        drawPond();

        // ========== 🔐 密码错误抖动 ==========
        function shakeForm() {
            const phone = document.querySelector('.phone-frame');
            if (!phone) return;
            phone.style.animation = 'none';
            phone.offsetHeight;
            phone.style.animation = 'shake 0.5s ease';
            setTimeout(() => { if (phone) phone.style.animation = ''; }, 500);
        }
        drawPts();

        // ========== Splash → Login ==========
        const phoneSplash = document.getElementById('phoneSplash');
        const loginSection = document.getElementById('loginSection');

        setTimeout(() => {
            phoneSplash.classList.add('hidden');
            loginSection.classList.remove('waiting');
        }, 2200);

        // ========== Tab switch ==========
        const tabs = document.querySelectorAll('.login-tab');
        const passwordMode = document.getElementById('passwordMode');
        const registerMode = document.getElementById('registerMode');
        const passwordInput = document.getElementById('passwordInput');
        const phoneInput = document.getElementById('phoneInput');
        const btnSubmitMain = document.getElementById('btnSubmitMain');
        let loginMode = 'password';

        tabs.forEach(t => {
            t.addEventListener('click', () => {
                tabs.forEach(x => x.classList.remove('active'));
                t.classList.add('active');
                loginMode = t.dataset.mode;
                passwordMode.style.display = loginMode === 'password' ? 'block' : 'none';
                registerMode.style.display = loginMode === 'register' ? 'block' : 'none';
                btnSubmitMain.textContent = loginMode === 'register' ? '注 册' : '登 录';
            });
        });

        // ========== Submit (login or register via Supabase) ==========
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async e => {
            e.preventDefault();
            btnSubmitMain.disabled = true;

            if (loginMode === 'register') {
                const username = document.getElementById('regUsername').value.trim();
                const pwd = document.getElementById('regPassword').value.trim();
                const pwd2 = document.getElementById('regPassword2').value.trim();

                if (username.length < 3) { showToast('用户名至少3个字符', 'err'); resetBtn('注 册'); return; }
                if (pwd.length < 6) { showToast('密码至少6位', 'err'); resetBtn('注 册'); return; }
                if (pwd !== pwd2) { showToast('两次密码不一致', 'err'); resetBtn('注 册'); return; }

                btnSubmitMain.textContent = '⏳ 注册中...';
                const email = username + '@windwalker.app';

                try {
                    const { data, error } = await supabase.auth.signUp({ email, password: pwd, options: { data: { username } } });
                    if (error) {
                        const msg = error.message.includes('already') ? '用户名已存在' : '注册失败: ' + error.message;
                        showToast(msg, 'err'); resetBtn('注 册'); return;
                    }
                    if (!data.user) { showToast('注册失败，请重试', 'err'); resetBtn('注 册'); return; }

                    // 随机分配一个头像
                    const randomAvatar = [{c:'#ffb8c6',i:'🐱'},{c:'#ffc8a0',i:'🐶'},{c:'#f0c0e0',i:'🐰'},{c:'#b8d8f0',i:'🐼'},{c:'#f0c8a0',i:'🦊'},{c:'#c0e0c8',i:'🐸'},{c:'#e0d0b8',i:'🐻'},{c:'#ffd0d0',i:'🐥'},{c:'#d0c8f0',i:'🦄'},{c:'#c8e8d0',i:'🌿'},{c:'#ffe0b0',i:'⭐'},{c:'#e0d8f8',i:'🌙'}][Math.floor(Math.random()*12)];
                    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" rx="100" fill="#fff"/><circle cx="100" cy="100" r="70" fill="${randomAvatar.c}" opacity="0.5"/><text x="100" y="125" text-anchor="middle" font-size="65">${randomAvatar.i}</text></svg>`;
                    let avatarUrl = '';
                    try {
                        const blob = new Blob([svg], { type: 'image/svg+xml' });
                        const { error: upErr } = await supabase.storage.from('avatars').upload(data.user.id + '_av.svg', blob, { upsert: true });
                        if (!upErr) { const { data: pub } = supabase.storage.from('avatars').getPublicUrl(data.user.id + '_av.svg'); avatarUrl = pub.publicUrl; }
                    } catch(e) {}

                    // 创建 profiles
                    const code = String(Math.floor(100000 + Math.random() * 900000));
                    await supabase.from('profiles').upsert({ id: data.user.id, username, user_code: code, avatar_url: avatarUrl });

                    // 确保有 session
                    if (!data.session) {
                        btnSubmitMain.textContent = '⏳ 登录中...';
                        const { error: loginErr } = await supabase.auth.signInWithPassword({ email, password: pwd });
                        if (loginErr) { showToast('注册成功但自动登录失败，请手动登录', 'err'); resetBtn('注 册'); return; }
                    }
                    showToast('✅ 注册成功！', 'ok');
                    setTimeout(() => window.location.href = 'index.html', 800);
                } catch(ex) {
                    showToast('网络错误，请检查连接后重试', 'err');
                    resetBtn('注 册');
                }
            } else {
                const username = phoneInput.value.trim();
                const pwd = passwordInput.value.trim();

                if (!username) { showToast('请输入用户名', 'err'); resetBtn('登 录'); return; }
                if (!pwd) { showToast('请输入密码', 'err'); resetBtn('登 录'); return; }

                btnSubmitMain.textContent = '⏳ 登录中...';
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email: username + '@windwalker.app', password: pwd });
                    if (error) { showToast('账号或密码错误', 'err'); resetBtn('登 录'); return; }
                    if (!data.session) { showToast('登录失败，请重试', 'err'); resetBtn('登 录'); return; }
                    showToast('✅ 登录成功！', 'ok');
                    setTimeout(() => window.location.href = 'index.html', 800);
                } catch(ex) {
                    showToast('网络错误，请检查连接后重试', 'err');
                    resetBtn('登 录');
                }
            }
        });

        function resetBtn(text) { btnSubmitMain.disabled = false; btnSubmitMain.textContent = text; }

        // ========== 忘记密码 ==========
        const forgotPwdLink = document.getElementById('forgotPwdLink');
        const forgotPwdPanel = document.getElementById('forgotPwdPanel');
        const forgotBack = document.getElementById('forgotBack');
        const forgotSubmit = document.getElementById('forgotSubmit');
        const forgotUsername = document.getElementById('forgotUsername');

        forgotPwdLink.addEventListener('click', e => {
            e.preventDefault();
            loginForm.style.display = 'none';
            forgotPwdPanel.style.display = 'block';
        });
        forgotBack.addEventListener('click', e => {
            e.preventDefault();
            loginForm.style.display = '';
            forgotPwdPanel.style.display = 'none';
        });
        forgotSubmit.addEventListener('click', async () => {
            const username = forgotUsername.value.trim();
            if (!username) { showToast('请输入用户名', 'err'); return; }
            forgotSubmit.disabled = true; forgotSubmit.textContent = '发送中...';
            const email = username + '@windwalker.app';
            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + window.location.pathname.replace('login.html','') + 'reset-password.html'
            });
            if (error) { showToast('发送失败: ' + error.message, 'err'); }
            else { showToast('如果账号存在，重置链接已发送（请检查Supabase Auth后台的邮件日志）', 'ok'); }
            forgotSubmit.disabled = false; forgotSubmit.textContent = '发送重置链接';
        });

        function goToIndex() {
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.4s ease';
                document.body.style.opacity = '0';
                setTimeout(() => { window.location.href = 'index.html'; }, 400);
            }, 600);
        }

        // ========== Toast ==========
        function showToast(msg, type) {
            if (type === 'err') shakeForm();
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + (type || 'ok');
            t.classList.add('show');
            clearTimeout(t._tid);
            t._tid = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ========== Pure Music Audio System (Login) ==========
        const AudioSys = (function() {
            let ctx = null, musicNodes = null, musicOn = true, musicVolume = 0.015;

            function ensureCtx() {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                return ctx;
            }

            // Soft chime
            function chime() {
                try {
                    const c = ensureCtx(), t = c.currentTime;
                    const n = [523, 659, 784][Math.floor(Math.random() * 3)];
                    const o = c.createOscillator(), g = c.createGain();
                    o.type = 'sine'; o.frequency.value = n;
                    g.gain.setValueAtTime(0, t);
                    g.gain.linearRampToValueAtTime(0.05, t + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
                    o.connect(g).connect(c.destination);
                    o.start(t); o.stop(t + 0.35);
                } catch(e){}
            }

            // Gentle pure music melody (slower, lower volume for login)
            const MELODY = [
                { n: 262, d: 1.2 },{ n: 330, d: 0.8 },{ n: 392, d: 1.0 },{ n: 330, d: 0.6 },
                { n: 294, d: 0.8 },{ n: 262, d: 1.0 },{ n: 220, d: 0.7 },{ n: 262, d: 1.4 },
                { n: 330, d: 0.9 },{ n: 294, d: 0.7 },{ n: 262, d: 1.0 },{ n: 196, d: 1.2 },
            ];
            let mIdx = 0, mTimer = null;

            function playNote() {
                if (!musicOn || !musicNodes) return;
                try {
                    const c = ensureCtx();
                    const { n, d } = MELODY[mIdx];
                    const o = c.createOscillator(), g = c.createGain();
                    o.type = 'sine'; o.frequency.value = n;
                    const dur = d * 0.7;
                    g.gain.setValueAtTime(0, c.currentTime);
                    g.gain.linearRampToValueAtTime(musicVolume * 3, c.currentTime + 0.08);
                    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
                    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 800;
                    o.connect(g).connect(f).connect(c.destination);
                    o.start(); o.stop(c.currentTime + dur + 0.1);
                    mIdx = (mIdx + 1) % MELODY.length;
                    mTimer = setTimeout(playNote, d * 1000);
                } catch(e){ mTimer = setTimeout(playNote, 800); }
            }

            function startMusic() {
                if (musicNodes) return;
                try {
                    const c = ensureCtx();
                    const pad = c.createOscillator(), pg = c.createGain();
                    pad.type = 'sine'; pad.frequency.value = 55;
                    pg.gain.value = musicVolume * 1.0;
                    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 150;
                    pad.connect(pg).connect(f).connect(c.destination);
                    pad.start();
                    musicNodes = { pad, pg, f };
                    mIdx = 0; playNote();
                } catch(e){}
            }

            function stopMusic() {
                if (mTimer) { clearTimeout(mTimer); mTimer = null; }
                if (!musicNodes) return;
                try { Object.values(musicNodes).forEach(n => { try{n.stop?.()}catch(e){} try{n.disconnect?.()}catch(e){} }); } catch(e){}
                musicNodes = null;
            }

            function setVolume(v) {
                musicVolume = Math.max(0.003, Math.min(0.04, v));
                if (musicNodes) musicNodes.pg.gain.value = musicVolume * 1.0;
            }

            function toggle() { musicOn = !musicOn; musicOn ? startMusic() : stopMusic(); return musicOn; }
            function initOnTouch() { if (musicOn) startMusic(); }

            return { chime, toggle, isOn: ()=>musicOn, initOnTouch, setVolume, startMusic, stopMusic };
        })();

        // Volume slider & toggle
        const btnMusicMini = document.getElementById('btnMusicMini');
        let volSliderEl = null;

        btnMusicMini.addEventListener('click', e => {
            e.stopPropagation();
            const on = AudioSys.toggle();
            btnMusicMini.textContent = on ? '🎵' : '🔇';
            btnMusicMini.classList.toggle('muted', !on);
        });

        // Long press or right click for volume control
        btnMusicMini.addEventListener('contextmenu', e => {
            e.preventDefault();
            showVolumeSlider();
        });
        btnMusicMini.addEventListener('dblclick', e => {
            e.stopPropagation();
            showVolumeSlider();
        });

        function showVolumeSlider() {
            if (volSliderEl) { volSliderEl.remove(); volSliderEl = null; return; }
            volSliderEl = document.createElement('input');
            volSliderEl.type = 'range';
            volSliderEl.min = '0.3'; volSliderEl.max = '4'; volSliderEl.step = '0.1';
            volSliderEl.value = '1.5';
            volSliderEl.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:9999;width:200px;accent-color:#38bdf8;';
            volSliderEl.addEventListener('input', () => {
                AudioSys.setVolume(parseFloat(volSliderEl.value) * 0.01);
            });
            document.body.appendChild(volSliderEl);
            setTimeout(() => { if (volSliderEl) { volSliderEl.remove(); volSliderEl = null; } }, 5000);
        }

        document.addEventListener('click', function once() { AudioSys.initOnTouch(); }, { once: true });
        document.addEventListener('click', e => {
            if (e.target.closest('button') && !e.target.closest('#btnMusicMini') && !e.target.closest('input')) AudioSys.chime();
        });

        // ========== Social ==========
        document.querySelectorAll('.social-btn').forEach(b => {
            b.addEventListener('click', () => showToast('第三方登录开发中', 'err'));
        });
    })();
    </script>
</body>
