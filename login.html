<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风之旅人 · 登录</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #06080d;
            --surface: #0c0f16;
            --border: #1e2636;
            --text: #e2e8f0;
            --text-muted: #7c8aa0;
            --accent: #38bdf8;
            --accent2: #818cf8;
            --accent-glow: rgba(56,189,248,0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Ambient glow */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(56,189,248,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(129,140,248,0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Canvas particles */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ========== 登录卡片 ========== */
        .login-card {
            position: relative; z-index: 1;
            width: 400px; max-width: 90vw;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 36px 32px 28px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
            animation: cardUp 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards;
            opacity: 0;
            transition: transform 0.15s ease-out;
        }
        @keyframes cardUp { 0%{opacity:0;transform:translateY(30px);} 100%{opacity:1;transform:translateY(0);} }

        .login-logo { text-align: center; margin-bottom: 20px; }
        .logo-circle {
            width: 64px; height: 64px; border-radius: 50%;
            background: linear-gradient(135deg, #e0f0f8, #f0e8f4);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; margin: 0 auto 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .login-logo h2 { font-size: 1.2rem; font-weight: 700; color: #4a5568; margin: 0; }
        .login-logo p { font-size: 0.72rem; color: #a0aec0; margin: 2px 0 0; letter-spacing: 1px; }

        .login-body { transition: opacity 0.4s; }

        /* 标签 */
        .login-tabs { display: flex; position: relative; background: #f0f4f8; border-radius: 14px; padding: 4px; margin-bottom: 22px; }
        .login-tab {
            flex: 1; text-align: center; padding: 10px; border-radius: 12px; cursor: pointer;
            font-size: 0.88rem; font-weight: 600; transition: 0.3s; border: none; background: transparent;
            color: #94a3b8; position: relative; z-index: 1;
        }
        .login-tab.active { color: #4a5568; }
        .tab-slider {
            position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px);
            background: #fff; border-radius: 11px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1); z-index: 0;
            pointer-events: none;
        }
        .login-tabs.register-active .tab-slider { transform: translateX(100%); }
        .login-tabs.register-active .login-tab:first-child { color: #94a3b8; }
        .login-tabs.register-active .login-tab:last-child { color: #4a5568; }

        /* 输入框 */
        .input-wrap {
            display: flex; align-items: center; gap: 10px;
            background: #f7fafc; border: 1.5px solid #e2e8f0; border-radius: 14px;
            padding: 0 14px; margin-bottom: 12px; transition: 0.3s;
        }
        .input-wrap:focus-within { border-color: #a0c4e8; box-shadow: 0 0 0 3px rgba(160,196,232,0.15); background: #fff; }
        .input-icon { font-size: 1rem; flex-shrink: 0; }
        .input-wrap input {
            flex: 1; padding: 13px 0; border: none; background: transparent;
            font-size: 0.9rem; font-family: inherit; color: #4a5568; outline: none;
        }
        .input-wrap input::placeholder { color: #c0c8d0; }

        /* 按钮 */
        .btn-login {
            width: 100%; padding: 14px; margin-top: 6px;
            background: linear-gradient(135deg, #a0c8e8, #c8b8e0);
            color: #fff; border: none; border-radius: 14px;
            font-size: 0.95rem; font-weight: 700; cursor: pointer;
            transition: 0.3s; letter-spacing: 0.5px;
            position: relative; overflow: hidden;
        }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(160,196,232,0.3); }
        .btn-login:active { transform: scale(0.98); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

        .forgot-link {
            display: block; text-align: center; margin-top: 10px;
            color: #a0aec0; font-size: 0.78rem; text-decoration: none; transition: 0.2s;
        }
        .forgot-link:hover { color: #7b8ba0; }

        .agreement {
            text-align: center; margin-top: 16px; font-size: 0.7rem; color: #c0c8d0;
        }
        .agreement a { color: #a0c4e8; text-decoration: none; }

        /* ========== Toast ========== */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.85rem;
            z-index: 100;
            opacity: 0;
            transition: all 0.4s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.ok { background: #34d399; color: #000; }
        .toast.err { background: #f87171; color: #fff; }

        /* ========== Responsive ========== */
        /* 涟漪动画 */
        @keyframes rippleOut {
            0% { transform: scale(0); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }
        /* 抖动动画 */
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        /* 按钮粒子爆发 */
        .btn-login:active::after {
            content: ''; position: absolute; inset: -10px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            animation: rippleOut 0.5s ease-out forwards; pointer-events: none; border-radius: 50%;
        }

        @media (max-width: 440px) {
            .phone-frame {
                width: calc(100vw - 32px);
                border-radius: 24px;
                padding: 32px 20px 24px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <!-- ========== 登录卡片 ========== -->
    <div class="login-card" id="loginCard">
        <!-- Logo -->
        <div class="login-logo" id="loginLogo">
            <div class="logo-circle">🧊</div>
            <h2>风之旅人</h2>
            <p>3D 模型资源库</p>
        </div>

        <!-- 主体 -->
        <div class="login-body" id="loginBody">
            <!-- 标签切换 -->
            <div class="login-tabs">
                <button class="login-tab active" data-mode="password">登 录</button>
                <button class="login-tab" data-mode="register">注 册</button>
                <div class="tab-slider"></div>
            </div>

            <form id="loginForm" novalidate>
                <div id="passwordMode">
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" id="phoneInput" placeholder="用户名" required>
                    </div>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="passwordInput" placeholder="密码" required>
                    </div>
                </div>

                <div id="registerMode" style="display:none;">
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" id="regUsername" placeholder="设置用户名 (3-16位)" maxlength="16">
                    </div>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="regPassword" placeholder="设置密码 (6-20位)" maxlength="20">
                    </div>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="regPassword2" placeholder="确认密码">
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btnSubmitMain">登 录</button>

                <a href="#" id="forgotPwdLink" class="forgot-link">忘记密码？</a>
            </form>

            <div id="forgotPwdPanel" style="display:none;text-align:center;">
                <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:10px;">输入用户名找回密码</p>
                <div class="input-wrap"><span class="input-icon">👤</span><input type="text" id="forgotUsername" placeholder="用户名"></div>
                <button id="forgotSubmit" class="btn-login" style="margin-top:10px;">发送重置链接</button>
                <a href="#" id="forgotBack" style="display:block;margin-top:10px;color:var(--accent);font-size:0.8rem;">← 返回登录</a>
            </div>

            <div class="agreement">登录即表示同意 <a href="#">用户协议</a> 和 <a href="#">隐私政策</a></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
    (function() {
        // ============================================================
        // ⚙ Supabase 配置 — 替换为你的 Supabase 项目信息
        //    在 Supabase 后台 → Settings → API 里找到这两个值
        // ============================================================
        const SUPABASE_URL = 'https://gxbeztgssxniuqwawsrz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_CEoUalap5DiFEfkBBuqJCw_DL21vR5o';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========== 🐟 鱼塘背景 ==========
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let W, H, mx = -999, my = -999, time = 0;

        function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
        resize(); window.addEventListener('resize', resize);
        document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
        document.addEventListener('mouseleave', () => { mx = -999; my = -999; });
        document.addEventListener('touchmove', e => { mx = e.touches[0].clientX; my = e.touches[0].clientY; }, {passive:true});

        // 🐟 全新可爱小鱼设计
        const fishes = [];
        const fishDefs = [
            { body:'#ffb0b8', belly:'#ffe0e5', fin:'#ff90a0', name:'樱樱' },  // 樱花粉
            { body:'#ffc898', belly:'#ffe8d0', fin:'#ffb070', name:'橘橘' },  // 蜜橘橙
            { body:'#ffe8c0', belly:'#fff8ee', fin:'#ffd090', name:'绵绵' },  // 奶黄
            { body:'#ffc8c0', belly:'#fff0ec', fin:'#ffa898', name:'桃桃' },  // 蜜桃
            { body:'#ffd8c8', belly:'#fff5f0', fin:'#ffc0a8', name:'团团' },  // 浅杏
        ];
        for (let i=0;i<5;i++) {
            const d = fishDefs[i];
            fishes.push({
                x: 100+Math.random()*(W-200), y: 80+Math.random()*(H-200),
                vx: (Math.random()-0.5)*0.35, vy: (Math.random()-0.5)*0.15,
                targetVx: 0, targetVy: 0,
                size: 28+Math.random()*16, def: d,
                tailPhase: Math.random()*6, bubbleTimer: Math.random()*100,
                changeTimer: Math.random()*200
            });
        }
        // 莲花
        const lotuses = [];
        for (let i=0;i<3;i++) lotuses.push({ x: Math.random()*W, y: 40+Math.random()*(H*0.3), size: 15+Math.random()*20, phase: Math.random()*6 });
        // 水草
        const plants = [];
        for (let i=0;i<8;i++) plants.push({ x: Math.random()*W, h: 40+Math.random()*80, w: 5+Math.random()*8, phase: Math.random()*6 });
        // 气泡
        const bubbles = [];
        function addBubble() { bubbles.push({ x:Math.random()*W, y:H+10, r:2+Math.random()*5, vy:0.3+Math.random()*0.5, o:0.3+Math.random()*0.4 }); }
        for (let i=0;i<15;i++) { const b={x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*5,vy:0,o:0};bubbles.push(b); }
        // 涟漪
        const ripples = [];
        document.addEventListener('click', e => { ripples.push({ x:e.clientX, y:e.clientY, r:0, maxR:60, o:0.6 }); });

        function drawFish(f) {
            ctx.save(); ctx.translate(f.x, f.y);
            const dir = f.vx >= 0 ? 1 : -1; ctx.scale(dir, 1);
            const s = f.size, d = f.def;
            const tailWag = Math.sin(time*0.15+f.tailPhase)*7;

            // 🌊 尾巴
            ctx.fillStyle = d.fin;
            ctx.beginPath();
            ctx.moveTo(-s*0.45, 0);
            ctx.bezierCurveTo(-s*0.9, -s*0.35+tailWag, -s*1.35, -s*0.4+tailWag*1.2, -s*1.15, tailWag*0.6);
            ctx.bezierCurveTo(-s*1.35, s*0.4-tailWag*1.2, -s*0.9, s*0.35-tailWag, -s*0.45, 0);
            ctx.fill();

            // 🎈 圆滚滚身体
            const bodyGrad = ctx.createLinearGradient(0, -s*0.45, 0, s*0.45);
            bodyGrad.addColorStop(0, d.body);
            bodyGrad.addColorStop(0.55, d.belly);
            bodyGrad.addColorStop(1, d.body);
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.ellipse(s*0.05, 0, s*0.55, s*0.44, 0.05, 0, Math.PI*2);
            ctx.fill();

            // 身体高光
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.beginPath();
            ctx.ellipse(-s*0.05, -s*0.15, s*0.2, s*0.2, -0.3, 0, Math.PI*2);
            ctx.fill();

            // 😊 腮红
            ctx.fillStyle = 'rgba(255,150,150,0.35)';
            ctx.beginPath(); ctx.ellipse(s*0.25, s*0.1, s*0.12, s*0.07, 0, 0, Math.PI*2); ctx.fill();

            // 👁‍🗨 大眼睛（萌系比例）
            const ex = s*0.28, ey = -s*0.1;
            // 眼白
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.ellipse(ex, ey, s*0.16, s*0.2, 0.05, 0, Math.PI*2); ctx.fill();
            // 瞳孔
            const pupilGrad = ctx.createRadialGradient(ex, ey, 0, ex, ey, s*0.14);
            pupilGrad.addColorStop(0, '#2a1810'); pupilGrad.addColorStop(0.6, '#3a2818'); pupilGrad.addColorStop(1, '#1a0800');
            ctx.fillStyle = pupilGrad;
            ctx.beginPath(); ctx.arc(ex+s*0.02, ey+s*0.02, s*0.1, 0, 7); ctx.fill();
            // 大高光
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(ex-s*0.04, ey-s*0.06, s*0.05, 0, 7); ctx.fill();
            // 小高光
            ctx.beginPath(); ctx.arc(ex+s*0.06, ey+s*0.04, s*0.025, 0, 7); ctx.fill();

            // 👄 小嘴
            ctx.strokeStyle = d.fin; ctx.lineWidth = s*0.03; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(s*0.15, s*0.1, s*0.06, 0.2, 1.8); ctx.stroke();

            // 🩴 小背鳍
            ctx.fillStyle = d.fin; ctx.globalAlpha = 0.6;
            ctx.beginPath(); ctx.moveTo(-s*0.15, -s*0.35);
            ctx.quadraticCurveTo(s*0.1, -s*0.5, s*0.25, -s*0.3);
            ctx.quadraticCurveTo(s*0.15, -s*0.3, -s*0.15, -s*0.28);
            ctx.fill();

            ctx.restore();
        }

        function drawLotus(l) {
            ctx.save(); ctx.translate(l.x, l.y);
            // 花瓣
            const petalCount = 6;
            for (let i=0;i<petalCount;i++) {
                const a = i*Math.PI*2/petalCount + Math.sin(time*0.02+l.phase)*0.1;
                ctx.fillStyle = `rgba(255,200,210,0.7)`;
                ctx.beginPath(); ctx.ellipse(Math.cos(a)*l.size*0.5, Math.sin(a)*l.size*0.5, l.size*0.4, l.size*0.25, a, 0, Math.PI*2); ctx.fill();
            }
            // 花心
            ctx.fillStyle='#f0e080'; ctx.beginPath(); ctx.arc(0,0,l.size*0.25,0,7); ctx.fill();
            // 莲叶
            ctx.fillStyle='rgba(120,190,140,0.6)';
            ctx.beginPath(); ctx.ellipse(0, l.size*0.3, l.size*1.2, l.size*0.6, 0, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function drawPlant(p) {
            ctx.strokeStyle='rgba(100,180,120,0.5)'; ctx.lineWidth=p.w; ctx.lineCap='round';
            ctx.beginPath(); ctx.moveTo(p.x, H);
            for (let i=0;i<4;i++) {
                const t = i/4;
                const sway = Math.sin(time*0.03+p.phase+i)*15;
                ctx.lineTo(p.x+sway, H-p.h*t);
            }
            ctx.stroke();
        }

        function drawPond() {
            ctx.clearRect(0,0,W,H);
            // 水背景渐变
            const water = ctx.createLinearGradient(0,0,0,H);
            water.addColorStop(0,'#d4eaf0'); water.addColorStop(0.3,'#c8e8f0'); water.addColorStop(0.7,'#b0d8e8'); water.addColorStop(1,'#90c0d8');
            ctx.fillStyle=water; ctx.fillRect(0,0,W,H);
            // 水面波纹
            for (let x=0;x<W;x+=60) {
                const y = 20+Math.sin(time*0.05+x*0.05)*3;
                ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1;
                ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+40,y+Math.sin(time*0.05+(x+40)*0.05)*3); ctx.stroke();
            }
            // 水草
            for (const p of plants) drawPlant(p);
            // 🐟 小鱼自主缓慢游动
            for (const f of fishes) {
                // 定时改变游动方向
                f.changeTimer--;
                if (f.changeTimer <= 0) {
                    f.changeTimer = 150 + Math.random() * 300;
                    f.targetVx = (Math.random() - 0.5) * 0.8;
                    f.targetVy = (Math.random() - 0.5) * 0.4;
                }
                // 鼠标靠近时才互动（120px 内）
                const dx = mx - f.x, dy = my - f.y, dist = Math.hypot(dx, dy) || 1;
                if (dist < 120 && mx > 0) {
                    // 轻轻靠近鼠标
                    f.targetVx = (dx / dist) * 0.6;
                    f.targetVy = (dy / dist) * 0.3;
                    f.changeTimer = 60; // 靠近后保持短暂方向
                }
                // 平滑过渡到目标速度
                f.vx += (f.targetVx - f.vx) * 0.02;
                f.vy += (f.targetVy - f.vy) * 0.02;
                f.x += f.vx; f.y += f.vy;
                // 边界回弹
                if (f.x < -60) f.x = W + 60;
                if (f.x > W + 60) f.x = -60;
                if (f.y < 40) f.y = 40;
                if (f.y > H - 40) f.y = H - 40;
                // 偶尔吐泡泡
                f.bubbleTimer++;
                if (f.bubbleTimer > 120 + Math.random() * 80) {
                    f.bubbleTimer = 0;
                    bubbles.push({ x: f.x + (f.vx >= 0 ? -10 : 10), y: f.y - 8, r: 1.5 + Math.random() * 4, vy: 0.15 + Math.random() * 0.3, o: 0.35 });
                }
                drawFish(f);
            }
            // 莲花
            for (const l of lotuses) { l.x+=Math.sin(time*0.01+l.phase)*0.2; l.y+=Math.cos(time*0.015+l.phase)*0.15; drawLotus(l); }
            // 气泡
            for (let i=bubbles.length-1;i>=0;i--) {
                const b=bubbles[i]; b.y-=b.vy; b.x+=Math.sin(time*0.03+i)*0.3;
                if (b.y<-20) { b.y=H+10; b.x=Math.random()*W; }
                ctx.fillStyle=`rgba(255,255,255,${b.o})`; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
            }
            if (Math.random()<0.03) addBubble();
            // 涟漪
            for (let i=ripples.length-1;i>=0;i--) {
                const r=ripples[i]; r.r+=1.5; r.o-=0.015;
                if (r.o<=0) { ripples.splice(i,1); continue; }
                ctx.strokeStyle=`rgba(255,255,255,${r.o})`; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,7); ctx.stroke();
            }
            time++; requestAnimationFrame(drawPond);
        }
        drawPond();

        // ========== 🔐 密码错误抖动 ==========
        function shakeForm() {
            const card = document.querySelector('.login-card');
            if (!card) return;
            card.style.animation = 'none';
            card.offsetHeight;
            card.style.animation = 'shake 0.5s ease';
            setTimeout(() => { if (card) card.style.animation = 'cardUp 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards'; }, 500);
        }
        // ========== 🎮 卡片3D倾斜 ==========
        const loginCard = document.getElementById('loginCard');
        document.addEventListener('mousemove', e => {
            if (!loginCard) return;
            const rect = loginCard.getBoundingClientRect();
            const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
            const rx = (e.clientY - cy) / (rect.height/2) * -5;
            const ry = (e.clientX - cx) / (rect.width/2) * 5;
            loginCard.style.transform = `perspective(800px) rotateX(${rx}deg) rotateY(${ry}deg)`;
        });
        document.addEventListener('mouseleave', () => {
            if (loginCard) loginCard.style.transform = '';
        });

        // ========== 🐟 点击鱼跳起来 ==========
        canvas.addEventListener('click', e => {
            for (const f of fishes) {
                const dx = e.clientX - f.x, dy = e.clientY - f.y;
                if (Math.hypot(dx, dy) < f.size * 1.2) {
                    f.vy = -4; f.vx += (Math.random()-0.5)*2;
                    // 鱼跳出水面的泡泡
                    for (let i=0;i<5;i++) {
                        bubbles.push({x:f.x+(Math.random()-0.5)*20, y:f.y, r:2+Math.random()*4, vy:1+Math.random(), o:0.5});
                    }
                    break;
                }
            }
        });

        // ========== ⌨ 输入聚焦 → 鱼游过来 ==========
        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('focus', () => {
                const rect = loginCard.getBoundingClientRect();
                const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
                fishes.forEach(f => {
                    f.targetVx = (cx - f.x) * 0.003;
                    f.targetVy = (cy - f.y) * 0.003;
                    f.changeTimer = 40;
                });
            });
        });

        // ========== Tab switch ==========
        const loginTabs = document.querySelector('.login-tabs');
        const tabs = document.querySelectorAll('.login-tab');
        const passwordMode = document.getElementById('passwordMode');
        const registerMode = document.getElementById('registerMode');
        const passwordInput = document.getElementById('passwordInput');
        const phoneInput = document.getElementById('phoneInput');
        const btnSubmitMain = document.getElementById('btnSubmitMain');
        let loginMode = 'password';

        tabs.forEach(t => {
            t.addEventListener('click', () => {
                tabs.forEach(x => x.classList.remove('active'));
                t.classList.add('active');
                loginMode = t.dataset.mode;
                passwordMode.style.display = loginMode === 'password' ? 'block' : 'none';
                registerMode.style.display = loginMode === 'register' ? 'block' : 'none';
                btnSubmitMain.textContent = loginMode === 'register' ? '注 册' : '登 录';
                // 滑块动画
                if (loginMode === 'register') loginTabs.classList.add('register-active');
                else loginTabs.classList.remove('register-active');
            });
        });

        // ========== Submit (login or register via Supabase) ==========
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async e => {
            e.preventDefault();
            btnSubmitMain.disabled = true;

            if (loginMode === 'register') {
                const username = document.getElementById('regUsername').value.trim();
                const pwd = document.getElementById('regPassword').value.trim();
                const pwd2 = document.getElementById('regPassword2').value.trim();

                if (username.length < 3) { showToast('用户名至少3个字符', 'err'); resetBtn('注 册'); return; }
                if (pwd.length < 6) { showToast('密码至少6位', 'err'); resetBtn('注 册'); return; }
                if (pwd !== pwd2) { showToast('两次密码不一致', 'err'); resetBtn('注 册'); return; }

                btnSubmitMain.textContent = '⏳ 注册中...';
                // 生成有效的邮箱（英文直接用作前缀，中文生成随机ID）
                const isAscii = /^[a-zA-Z0-9]+$/.test(username);
                const emailId = isAscii ? username : ('u' + Date.now().toString(36) + Math.random().toString(36).slice(2,5));
                const email = emailId + '@windwalker.app';

                try {
                    const { data, error } = await supabase.auth.signUp({ email, password: pwd, options: { data: { username } } });
                    if (error) {
                        const msg = error.message.includes('already') ? '用户名已存在' : '注册失败: ' + error.message;
                        showToast(msg, 'err'); resetBtn('注 册'); return;
                    }
                    if (!data.user) { showToast('注册失败，请重试', 'err'); resetBtn('注 册'); return; }

                    // 随机分配一个头像
                    const randomAvatar = [{c:'#ffb8c6',i:'🐱'},{c:'#ffc8a0',i:'🐶'},{c:'#f0c0e0',i:'🐰'},{c:'#b8d8f0',i:'🐼'},{c:'#f0c8a0',i:'🦊'},{c:'#c0e0c8',i:'🐸'},{c:'#e0d0b8',i:'🐻'},{c:'#ffd0d0',i:'🐥'},{c:'#d0c8f0',i:'🦄'},{c:'#c8e8d0',i:'🌿'},{c:'#ffe0b0',i:'⭐'},{c:'#e0d8f8',i:'🌙'}][Math.floor(Math.random()*12)];
                    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" rx="100" fill="#fff"/><circle cx="100" cy="100" r="70" fill="${randomAvatar.c}" opacity="0.5"/><text x="100" y="125" text-anchor="middle" font-size="65">${randomAvatar.i}</text></svg>`;
                    let avatarUrl = '';
                    try {
                        const blob = new Blob([svg], { type: 'image/svg+xml' });
                        const { error: upErr } = await supabase.storage.from('avatars').upload(data.user.id + '_av.svg', blob, { upsert: true });
                        if (!upErr) { const { data: pub } = supabase.storage.from('avatars').getPublicUrl(data.user.id + '_av.svg'); avatarUrl = pub.publicUrl; }
                    } catch(e) {}

                    // 创建 profiles
                    const code = String(Math.floor(100000 + Math.random() * 900000));
                    // 只有非英文用户名才存 email_id
                    const profileData = { id: data.user.id, username, user_code: code, avatar_url: avatarUrl };
                    if (!isAscii) profileData.email_id = emailId;
                    await supabase.from('profiles').upsert(profileData);

                    // 确保有 session
                    if (!data.session) {
                        btnSubmitMain.textContent = '⏳ 登录中...';
                        const { error: loginErr } = await supabase.auth.signInWithPassword({ email, password: pwd });
                        if (loginErr) { showToast('注册成功但自动登录失败，请手动登录', 'err'); resetBtn('注 册'); return; }
                    }
                    showToast('✅ 注册成功！', 'ok');
                    setTimeout(() => window.location.href = 'index.html', 800);
                } catch(ex) {
                    showToast('网络错误，请检查连接后重试', 'err');
                    resetBtn('注 册');
                }
            } else {
                const username = phoneInput.value.trim();
                const pwd = passwordInput.value.trim();

                if (!username) { showToast('请输入用户名', 'err'); resetBtn('登 录'); return; }
                if (!pwd) { showToast('请输入密码', 'err'); resetBtn('登 录'); return; }

                btnSubmitMain.textContent = '⏳ 登录中...';
                try {
                    // 先从 profiles 查出邮箱映射（兼容旧账号）
                    const { data: pf } = await supabase.from('profiles').select('email_id').eq('username', username).maybeSingle();
                    const email = (pf?.email_id || username) + '@windwalker.app';
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pwd });
                    if (error) { showToast('账号或密码错误', 'err'); resetBtn('登 录'); return; }
                    if (!data.session) { showToast('登录失败，请重试', 'err'); resetBtn('登 录'); return; }
                    showToast('✅ 登录成功！', 'ok');
                    setTimeout(() => window.location.href = 'index.html', 800);
                } catch(ex) {
                    showToast('网络错误，请检查连接后重试', 'err');
                    resetBtn('登 录');
                }
            }
        });

        function resetBtn(text) { btnSubmitMain.disabled = false; btnSubmitMain.textContent = text; }

        // ========== 忘记密码 ==========
        const forgotPwdLink = document.getElementById('forgotPwdLink');
        const forgotPwdPanel = document.getElementById('forgotPwdPanel');
        const forgotBack = document.getElementById('forgotBack');
        const forgotSubmit = document.getElementById('forgotSubmit');
        const forgotUsername = document.getElementById('forgotUsername');

        forgotPwdLink.addEventListener('click', e => {
            e.preventDefault();
            loginForm.style.display = 'none';
            forgotPwdPanel.style.display = 'block';
        });
        forgotBack.addEventListener('click', e => {
            e.preventDefault();
            loginForm.style.display = '';
            forgotPwdPanel.style.display = 'none';
        });
        forgotSubmit.addEventListener('click', async () => {
            const username = forgotUsername.value.trim();
            if (!username) { showToast('请输入用户名', 'err'); return; }
            forgotSubmit.disabled = true; forgotSubmit.textContent = '发送中...';
            const { data: pfp } = await supabase.from('profiles').select('email_id').eq('username', username).maybeSingle();
            const email = (pfp?.email_id || username) + '@windwalker.app';
            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + window.location.pathname.replace('login.html','') + 'reset-password.html'
            });
            if (error) { showToast('发送失败: ' + error.message, 'err'); }
            else { showToast('如果账号存在，重置链接已发送（请检查Supabase Auth后台的邮件日志）', 'ok'); }
            forgotSubmit.disabled = false; forgotSubmit.textContent = '发送重置链接';
        });

        function goToIndex() {
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.4s ease';
                document.body.style.opacity = '0';
                setTimeout(() => { window.location.href = 'index.html'; }, 400);
            }, 600);
        }

        // ========== Toast ==========
        function showToast(msg, type) {
            if (type === 'err') shakeForm();
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + (type || 'ok');
            t.classList.add('show');
            clearTimeout(t._tid);
            t._tid = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ========== 🎵 背景轻音乐 + 🔊 按键音效 ==========
        const AudioSys = (function() {
            let ctx = null, musicOn = true, sfxOn = true;

            function ensureCtx() {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                return ctx;
            }

            // 🔊 点击音效（轻柔水滴声）
            function playClick() {
                if (!sfxOn) return;
                try {
                    const c = ensureCtx(), t = c.currentTime;
                    const o = c.createOscillator(), g = c.createGain();
                    o.type = 'sine'; o.frequency.setValueAtTime(800, t); o.frequency.exponentialRampToValueAtTime(400, t+0.08);
                    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.08);
                    o.connect(g).connect(c.destination);
                    o.start(t); o.stop(t+0.08);
                } catch(e) {}
            }

            // 🎵 背景轻音乐（卡林巴/八音盒风格）
            const MELODY = [
                { n:523, d:1.2 },{ n:659, d:0.8 },{ n:784, d:1.0 },{ n:659, d:0.6 },
                { n:587, d:0.8 },{ n:523, d:1.0 },{ n:440, d:0.7 },{ n:523, d:1.4 },
                { n:659, d:0.9 },{ n:587, d:0.7 },{ n:523, d:1.0 },{ n:392, d:1.2 },
                { n:440, d:0.8 },{ n:523, d:1.0 },{ n:587, d:0.7 },{ n:659, d:1.5 },
                { n:784, d:0.6 },{ n:880, d:0.8 },{ n:784, d:1.0 },{ n:659, d:0.7 },
                { n:523, d:1.0 },{ n:587, d:0.7 },{ n:523, d:1.2 },{ n:440, d:1.4 },
            ];
            let mIdx = 0, mTimer = null, mNodes = null;

            function playNote() {
                if (!musicOn) return;
                try {
                    const c = ensureCtx(), { n, d } = MELODY[mIdx];
                    const o = c.createOscillator(), g = c.createGain();
                    o.type = 'triangle'; o.frequency.value = n;
                    const dur = d*0.65;
                    g.gain.setValueAtTime(0, c.currentTime);
                    g.gain.linearRampToValueAtTime(0.025, c.currentTime+0.06);
                    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+dur);
                    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1200; f.Q.value = 3;
                    const dly = c.createDelay(0.2); dly.delayTime.value = 0.15;
                    const fbg = c.createGain(); fbg.gain.value = 0.3;
                    o.connect(g).connect(f);
                    f.connect(c.destination);
                    f.connect(dly); dly.connect(fbg); fbg.connect(f);
                    o.start(); o.stop(c.currentTime+dur+0.2);
                    mIdx = (mIdx+1)%MELODY.length;
                    mTimer = setTimeout(playNote, d*950);
                } catch(e) { mTimer = setTimeout(playNote, 1000); }
            }

            function startMusic() { if (mTimer) return; mIdx = 0; playNote(); }
            function stopMusic() { if (mTimer) { clearTimeout(mTimer); mTimer = null; } }
            function toggleMusic() { musicOn = !musicOn; musicOn ? startMusic() : stopMusic(); return musicOn; }
            function toggleSfx() { sfxOn = !sfxOn; return sfxOn; }

            document.addEventListener('click', function once() {
                if (musicOn) startMusic();
            }, { once: true });

            return { playClick, toggleMusic, toggleSfx, isMusicOn: ()=>musicOn, isSfxOn: ()=>sfxOn };
        })();

        // 🎵 音乐开关 + 🔊 音效开关
        const btnMusic = document.createElement('button');
        btnMusic.textContent = '🎵'; btnMusic.title = '背景音乐';
        btnMusic.style.cssText = 'position:fixed;top:16px;right:66px;z-index:100;width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,0.08);background:rgba(255,255,255,0.8);cursor:pointer;font-size:1.1rem;backdrop-filter:blur(10px);';
        document.body.appendChild(btnMusic);
        btnMusic.addEventListener('click', (e) => {
            e.stopPropagation();
            const on = AudioSys.toggleMusic();
            btnMusic.textContent = on ? '🎵' : '🔇';
            btnMusic.style.opacity = on ? '1' : '0.5';
        });

        const btnSfx = document.createElement('button');
        btnSfx.textContent = '🔔'; btnSfx.title = '按键音效';
        btnSfx.style.cssText = 'position:fixed;top:16px;right:16px;z-index:100;width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,0.08);background:rgba(255,255,255,0.8);cursor:pointer;font-size:1rem;backdrop-filter:blur(10px);';
        document.body.appendChild(btnSfx);
        btnSfx.addEventListener('click', (e) => {
            e.stopPropagation();
            const on = AudioSys.toggleSfx();
            btnSfx.textContent = on ? '🔔' : '🔕';
            btnSfx.style.opacity = on ? '1' : '0.5';
        });

        // 🔊 所有按钮自动加点击音效
        document.addEventListener('click', e => {
            if (e.target.closest('button') || e.target.closest('a')) AudioSys.playClick();
        });
    })();
    </script>
</body>
</html>
